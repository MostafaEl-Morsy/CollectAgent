<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <title>تحديث النظام</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 100px;
            background-color: #f8f9fa;
            color: #333;
        }

        h1 {
            color: #0056b3;
        }

        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #0056b3;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h1>النظام تحت التحديث</h1>
    <p>نقوم الآن بتنزيل تحديثات جديدة لتحسين تجربتكم. سيعود النظام للعمل خلال دقائق معدودة.</p>
    <p>يرجى عدم تحديث الصفحة، حاول مرة أخرى بعد قليل.</p>
</body>
</html>
